<div class="auth-form">
  <header class="auth-form__head">
    <h2 class="auth-form__title">Crea tu cuenta de docente</h2>
    <p class="auth-form__sub">Los estudiantes no se registran aquí: los carga el docente por Excel.</p>
  </header>

  <form class="form" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <label class="field">
      <span class="field__label">Nombre completo</span>
      <input type="text" formControlName="nombre" autocomplete="name" />
      @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
        <span class="field__error">Escribe tu nombre (mínimo 3 caracteres).</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Correo institucional</span>
      <input type="email" formControlName="correo" autocomplete="username"
        placeholder="tu@universidad.edu" />
      @if (form.controls.correo.touched && form.controls.correo.invalid) {
        <span class="field__error">Ingresa un correo válido.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Número de identificación</span>
      <input type="text" formControlName="numeroIdentificacion" inputmode="numeric" />
      @if (form.controls.numeroIdentificacion.touched && form.controls.numeroIdentificacion.invalid) {
        <span class="field__error">Solo dígitos (entre 5 y 15).</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Contraseña</span>
      <span class="field__control">
        <input [type]="verContrasena() ? 'text' : 'password'" formControlName="contrasena"
          autocomplete="new-password" placeholder="8+ caracteres, mayúscula, número y símbolo" />
        <button type="button" class="field__toggle" [attr.aria-pressed]="verContrasena()"
          [attr.aria-label]="verContrasena() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          (click)="verContrasena.set(!verContrasena())">
          @if (verContrasena()) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </span>
      @if (form.controls.contrasena.touched && errorContrasena(); as msg) {
        <span class="field__error">{{ msg }}</span>
      }
    </label>

    @if (error(); as msg) {
      <app-alerta tipo="error" [mensaje]="msg" />
    }

    <button type="submit" class="btn btn--primario btn--block" [disabled]="enviando()">
      {{ enviando() ? 'Creando cuenta…' : 'Crear cuenta de docente' }}
    </button>

    <p class="form__switch">
      ¿Ya tienes una cuenta?
      <a class="link-btn" routerLink="/auth/login">Inicia sesión</a>
    </p>
  </form>
</div>
