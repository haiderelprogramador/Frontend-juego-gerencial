<div class="auth-form">
  <header class="auth-form__head">
    <h2 class="auth-form__title">Bienvenido de nuevo</h2>
    <p class="auth-form__sub">Ingresa para continuar con tu simulación.</p>
  </header>

  <!-- 🎨 prototipo: OAuth aún no implementado -->
  <button type="button" class="btn btn--secundario btn--block auth-form__google" disabled
    title="Disponible cuando se integre el backend">
    <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.6 9.5 24 9.5Z" />
      <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.5 7l7 5.4c4.1-3.8 6.5-9.4 6.5-16.9Z" />
      <path fill="#FBBC05" d="M10.4 28.3a14.5 14.5 0 0 1 0-8.6l-7.8-6.1a24 24 0 0 0 0 20.8l7.8-6.1Z" />
      <path fill="#34A853" d="M24 48c6.2 0 11.5-2 15.3-5.6l-7-5.4c-2 1.3-4.6 2.1-8.3 2.1-6.4 0-11.7-3.7-13.6-8.8l-7.8 6.1C6.5 42.6 14.6 48 24 48Z" />
    </svg>
    Continuar con Google
  </button>

  <div class="auth-form__divider"><span>o continúa con tu correo</span></div>

  <form class="form" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <label class="field">
      <span class="field__label">Correo electrónico</span>
      <input type="email" formControlName="correo" autocomplete="username"
        placeholder="tu@universidad.edu" />
      @if (form.controls.correo.touched && form.controls.correo.invalid) {
        <span class="field__error">Ingresa un correo válido.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Contraseña</span>
      <span class="field__control">
        <input [type]="verContrasena() ? 'text' : 'password'" formControlName="contrasena"
          autocomplete="current-password" placeholder="••••••••" />
        <button type="button" class="field__toggle" [attr.aria-pressed]="verContrasena()"
          [attr.aria-label]="verContrasena() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          (click)="verContrasena.set(!verContrasena())">
          @if (verContrasena()) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </span>
      @if (form.controls.contrasena.touched && form.controls.contrasena.invalid) {
        <span class="field__error">La contraseña es obligatoria.</span>
      }
    </label>

    <div class="auth-form__role">
      <span class="field__label">Ingresar como</span>
      <div class="auth-form__role-opts" role="group" aria-label="Ingresar como">
        <button type="button" [class.is-active]="rolPreferido() === 'ESTUDIANTE'"
          (click)="rolPreferido.set('ESTUDIANTE')">Estudiante</button>
        <button type="button" [class.is-active]="rolPreferido() === 'DOCENTE'"
          (click)="rolPreferido.set('DOCENTE')">Docente</button>
      </div>
      <a class="auth-form__forgot" routerLink="/auth/login" fragment="recuperar">¿Olvidaste tu contraseña?</a>
    </div>

    @if (error(); as msg) {
      <app-alerta tipo="error" [mensaje]="msg" />
    }

    <button type="submit" class="btn btn--primario btn--block" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Iniciar sesión' }}
      @if (!enviando()) { <span aria-hidden="true">→</span> }
    </button>

    <p class="form__switch">
      ¿No tienes cuenta?
      <a class="link-btn" routerLink="/auth/registro-docente">Regístrate aquí</a>
    </p>
  </form>
</div>
